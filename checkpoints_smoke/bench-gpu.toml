[training]
checkpoint_dir = "checkpoints_smoke/gpu"
buffer_capacity = 200000
batch_size = 512
epochs_per_iteration = 1
epoch_early_stop_rel = 0.005
total_training_steps = 1000
total_iterations = 1
device = "cuda:0"

[self_play]
num_games = 128
num_threads = 32
iteration = 0
show_progress = true
fixed_player_count = [5, 7]
concurrent_games = 128

[mcts]
c_puct = 1.5
num_determinizations = 5
sims_per_determinization = 100
min_sims_floor = 60
temperature = 1.0
arena_capacity = 4096

[eval]
eval_games = 0
eval_interval = 0
eval_lookback = 0
bid_success_promotion_delta = 0.02

[gpu_eval]
enabled = true
device = "cuda:0"
max_batch = 128
max_wait_us = 200
pad_to_max_seq = true
