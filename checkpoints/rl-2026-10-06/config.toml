[run]
seed = 1
hours = 8.0
init_checkpoint = "checkpoints/pretrain-2026-10-06/checkpoint"
init_model = "checkpoints/pretrain-2026-10-06/model"
actors = 28

[selfplay.mix]
players = [5]
start_cards = 7
large_round_exponent = 0.0

[selfplay.search]
c_puct = 0.20000000298023224
lambda = 1.0
bid_temperature = 1.0
play_temperature = 0.0
dirichlet_epsilon = 0.25
dirichlet_alpha = 0.0
