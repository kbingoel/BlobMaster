[run]
seed = 1
hours = 3.5
init_checkpoint = "checkpoints/rl-2026-10-06/models/step-007600/checkpoint"
init_model = "checkpoints/rl-2026-10-06/models/step-007600/model"
actors = 24

[selfplay.mix]
players = [5]
start_cards = 7
large_round_exponent = 0.0

[selfplay.search]
c_puct = 1.0
lambda = 1.0
bid_temperature = 1.0
play_temperature = 0.0
dirichlet_epsilon = 0.0
dirichlet_alpha = 0.0
one_card_bids = "exact"
prune_forced_visits = true
