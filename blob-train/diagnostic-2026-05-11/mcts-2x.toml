# Diagnostic 2026-05-11 — MCTS-budget 2× arm.
#
# Drives 5 × 200 = 1000 sims per non-forced decision (vs 500 in training).
#
# IMPORTANT: `adaptive_budget` in blob-engine/src/mcts.rs:802 HARDCODES
# `(dets, sims) = (5, 100)` and ignores `cfg.num_determinizations` /
# `cfg.sims_per_determinization` — those fields are decorative (logged
# at startup, never read at decision time). The only knob that actually
# flows through is `min_sims_floor`: when set above `dets * sims = 500`,
# adaptive_budget raises `sims` to `ceil(floor / dets)`. So
# `min_sims_floor = 1000` → `(5, 200)` per decision. The sims_per_det
# field below is kept at 200 for log readability only.

[training]
checkpoint_dir = "checkpoints/run-2026-05-06"
buffer_capacity = 500000
batch_size = 512
epochs_per_iteration = 10
epoch_early_stop_rel = 0.005
total_iterations = 1
device = "cuda:0"
enable_muon = false

[self_play]
num_games = 1
num_threads = 32
iteration = 0
show_progress = false
use_int8 = false

[mcts]
c_puct = 1.5
num_determinizations = 5
sims_per_determinization = 200
min_sims_floor = 1000
temperature = 1.0
arena_capacity = 4096
target_batch = 5

[mcts.temperature_schedule]
kind = "hard_step"
early = 1.0
late = 0.1
switch_at = 15

[eval]
eval_games = 192
eval_interval = 5
eval_lookback = 20
bid_success_promotion_delta = 0.02
eval_num_threads = 32
anchor_promotion_min_gap = 25
anchor_promotion_lower95 = 0.55
