# Diagnostic 2026-05-11 — MCTS-budget control arm.
#
# Identical MCTS settings to `run-2026-05-06.toml` (5 × 100 = 500 sims per
# decision). Used by `scripts/diagnostic-2026-05-11.sh` to replay
# iter_145-vs-iter_0 and iter_80-vs-iter_0 at the training-time sim budget,
# so the 2× arm has a like-for-like baseline.

[training]
checkpoint_dir = "checkpoints/run-2026-05-06"
buffer_capacity = 500000
batch_size = 512
epochs_per_iteration = 10
epoch_early_stop_rel = 0.005
total_iterations = 1
device = "cuda:0"
enable_muon = false

[self_play]
num_games = 1
num_threads = 32
iteration = 0
show_progress = false
use_int8 = false

[mcts]
c_puct = 1.5
num_determinizations = 5
sims_per_determinization = 100
min_sims_floor = 60
temperature = 1.0
arena_capacity = 4096
target_batch = 5

[mcts.temperature_schedule]
kind = "hard_step"
early = 1.0
late = 0.1
switch_at = 15

[eval]
eval_games = 192
eval_interval = 5
eval_lookback = 20
bid_success_promotion_delta = 0.02
eval_num_threads = 32
anchor_promotion_min_gap = 25
anchor_promotion_lower95 = 0.55
