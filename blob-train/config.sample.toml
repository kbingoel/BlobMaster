# Sample TrainingConfig for blobmaster-train.
# CLI flags (--checkpoint-dir, --batch-size, --num-games, --num-threads,
# --device) override the matching values below.

[training]
# Session 7.3c (Phase A): reproduce the 7.2 baseline. Four reverts vs 7.3b:
# flat 5×100 MCTS (in code), VALUE_HEAD_LR_SCALE=1.0 (in code),
# epoch_early_stop_rel=0.005, total_iterations=15. The LR schedule now
# decays per-iteration (no total_training_steps knob) so the epoch-stop
# setting can no longer steepen the cosine; see 7.3b-analysis.md §7.3.
checkpoint_dir = "checkpoints"
buffer_capacity = 500000
batch_size = 512
epochs_per_iteration = 10
epoch_early_stop_rel = 0.005
total_iterations = 15
device = "cuda:0"
# Session 7.4d / overnight 2026-04-28: Muon vs AdamW-only converged to
# identical eval strength by iter 9 on this 1.63M / d_model=128 model
# (paired iter-9 evals: 117/192 wins on both, see
# logs/overnight-2026-04-27/SUMMARY.md). Defaulted off; the Rust default
# in [TrainingLoopConfig] also sets this to false, so omitting the knob
# is equivalent. Set to true only for architecture stretches (≥100M params)
# where the published Muon literature predicts a measurable win.
enable_muon = false

[self_play]
# 118 × ~680 decisions ≈ 80K examples/iter (matches Section 5/6 downstream
# sizing). Session 7.1 bumped this from 64.
num_games = 118
num_threads = 32
iteration = 0
show_progress = true
# Session 7.1 smoke test forces 5P7C; remove / set to `false` for the mixed
# Section 5 distribution.
fixed_player_count = [5, 7]
# Session 7.4b: when true, self-play workers load `model.int8.onnx` (the
# QDQ-quantized sibling produced by `scripts/export_onnx.py --int8-out`).
# Eval keeps using the FP32 `model.onnx` so the eval signal is not fighting
# quantization noise on both sides. Enable only after running
# `scripts/validate_int8.py` to confirm the policy-agreement gate.
use_int8 = false

[mcts]
c_puct = 1.5
num_determinizations = 5
sims_per_determinization = 100
min_sims_floor = 60
temperature = 1.0
# Session 7.4d: optional per-decision temperature schedule. When the
# `[mcts.temperature_schedule]` block is present it overrides the constant
# `temperature` above; remove or comment out the block to fall back to the
# constant. Only a hard-step schedule is implemented (AlphaZero-style):
# `early` τ for `decision_index < switch_at`, then `late` τ thereafter.
# `decision_index` is a global counter — one increment per `mcts_search`
# call across all seats, **both bid and play, forced or not** (every
# decision flows through one `mcts_search` call; the forced-move
# short-circuit is inside, so the counter still advances on forced moves).
# For 5P7C ≈ 225 decisions/game, so `switch_at = 15` matches the dev-plan
# §7.4d default proposal (first ~7% exploratory, rest near-greedy).
# Late τ=0.1 keeps a sliver of stochasticity; set to 0.0 for pure argmax.
#
# fix-mcts-plan.md Step 3: the schedule applies **only** to the
# action-sampling distribution (`MctsResult.policy_sampling`). The
# training label (`MctsResult.policy_target`) is held at τ=1 regardless,
# so the policy head trains against the full visit distribution and
# does not collapse to one-hot under the late-game sampler. Eval rollouts
# explicitly override τ→0 to be greedy and noise-free (epsilon=0 too),
# so they are unaffected by this schedule.
# [mcts.temperature_schedule]
# kind = "hard_step"
# early = 1.0
# late = 0.1
# switch_at = 15
arena_capacity = 4096
# Session 7.4c stage 2: leaves per batched ONNX call. Round-robin filled
# across `num_determinizations` trees, with virtual loss redirecting
# concurrent descents inside the same tree away from each other. `1` is
# fully serial (one leaf per eval); `num_determinizations` is stage-1
# cross-det only (no virtual loss); larger values raise the GEMM batch
# beyond `num_determinizations`. The 2026-04-27 sweep (T=32, B∈{5,8,12,16})
# put the optimum at `target_batch = num_determinizations = 5` — per-call
# ONNX cost rises super-linearly past 5 on this hardware/model. Keep 5
# as the default; revisit only if `num_determinizations` grows or the
# model widens to d_model ≥ 256.
target_batch = 5
# fix-mcts-plan.md Step 1 / C1: root Dirichlet noise. AlphaZero-style
# exploration injected only at each determinization's root prior:
# `P'(a) = (1 − ε) · P(a) + ε · η(a)`, η ~ Dir(α). Eval rollouts always
# run with epsilon=0 (forced inside `play_eval_game_until`), so strength
# comparisons stay deterministic. Set `root_dirichlet_epsilon = 0.0` here
# to recover the pre-7.5 noise-free regime.
# `root_dirichlet_alpha = 0.0` selects the DeepMind 10/num_legal heuristic
# (recommended for Blob's variable branching 5..14). Set a positive fixed
# value (e.g. 0.3, the chess default) to override.
root_dirichlet_alpha = 0.0
root_dirichlet_epsilon = 0.25

[eval]
# 192 = 6 × 32-thread batches. Under the parallel eval harness the Wilson
# CI is checked at multiples of `eval_num_threads`; 200 would schedule a
# 7th batch in which only 8 games count toward the CI before the cap.
eval_games = 192
eval_interval = 5
eval_lookback = 20
bid_success_promotion_delta = 0.02
eval_num_threads = 32
